<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Drive</title>
<style>
  body { margin:0; overflow:hidden; background:#0a0f1a; font-family:monospace; }
  canvas { display:block; }
  #hud { position:fixed; bottom:20px; left:20px; color:#fff; font-size:15px; background:rgba(0,0,0,.55); padding:10px 14px; border-radius:8px; pointer-events:none; backdrop-filter:blur(6px); }
  #help { position:fixed; top:20px; left:20px; color:#fff; font-size:12px; background:rgba(0,0,0,.55); padding:10px 14px; border-radius:8px; pointer-events:none; line-height:1.6; backdrop-filter:blur(6px); }
  #camLabel { position:fixed; top:20px; right:20px; color:#fff; font-size:13px; background:rgba(0,0,0,.55); padding:8px 12px; border-radius:8px; pointer-events:none; backdrop-filter:blur(6px); }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.82); color:#fff; font-size:20px; cursor:pointer; text-align:center; padding:20px; }
  #start small { display:block; font-size:12px; opacity:.7; margin-top:8px; }
</style>
</head>
<body>
<div id="hud">Speed: <span id="speed">0</span> km/h</div>
<div id="camLabel">Camera: Chase</div>
<div id="help">
  W/S or ↑/↓ : throttle / brake / reverse<br>
  A/D or ←/→ : steer<br>
  Space : handbrake<br>
  C : camera &nbsp;|&nbsp; R : reset
</div>
<div id="start">CLICK TO START<br><small>Enables engine sound</small></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================
// RENDERER + POST-PROCESSING
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8eb8d8);
scene.fog = new THREE.Fog(0x8eb8d8, 120, 500);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 2000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.85));
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0xa8c8e8, 0x3a2f28, 1.2));
const sun = new THREE.DirectionalLight(0xffe4b0, 2.5);
sun.position.set(120, 160, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left:-200, right:200, top:200, bottom:-200, far:600 });
scene.add(sun);

// ============================================================
// CITY: GROUND + ROADS (procedural)
// ============================================================
const GRID = 5, BLOCK = 44, ROAD_W = 14;
const CELL = BLOCK + ROAD_W, HALF = GRID * CELL / 2;

{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),
    new THREE.MeshStandardMaterial({ color:0x2d3a2a, roughness:1 }));
  g.rotation.x = -Math.PI/2; g.position.y = -0.02; g.receiveShadow = true; scene.add(g);
}

const asphalt = new THREE.MeshStandardMaterial({ color:0x262626, roughness:0.92 });
const lineMat = new THREE.MeshStandardMaterial({ color:0xf0f0f0 });

for (let i = 0; i <= GRID; i++) {
  const p = i * CELL - HALF;
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(HALF*2, ROAD_W), asphalt);
  rh.rotation.x = -Math.PI/2; rh.position.set(0, 0.001, p); rh.receiveShadow = true; scene.add(rh);
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, HALF*2), asphalt);
  rv.rotation.x = -Math.PI/2; rv.position.set(p, 0.001, 0); rv.receiveShadow = true; scene.add(rv);
  for (let t = -HALF+6; t < HALF; t += 10) {
    const dh = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.32), lineMat);
    dh.rotation.x = -Math.PI/2; dh.position.set(t, 0.02, p); scene.add(dh);
    const dv = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 4), lineMat);
    dv.rotation.x = -Math.PI/2; dv.position.set(p, 0.02, t); scene.add(dv);
  }
}

// ============================================================
// MODEL LOADING
// ============================================================
const loader = new GLTFLoader();
const colliders = [];

// --- CAR ---
// Fallback car: box, facing +Z
const fallbackCar = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 4),
    new THREE.MeshStandardMaterial({ color:0xcc2222, metalness:0.6, roughness:0.3 })
  );
  body.position.y = 0.6; body.castShadow = true;
  fallbackCar.add(body);
}
const car = fallbackCar;
scene.add(car);

loader.load('models/car.glb', (gltf) => {
  const model = gltf.scene;

  // Auto-scale to ~4.5 units long
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const scale = 4.5 / Math.max(size.x, size.z);
  model.scale.setScalar(scale);

  // Recompute after scaling, center on origin, rest on ground
  const box2 = new THREE.Box3().setFromObject(model);
  const center = box2.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.position.y += (box2.max.y - box2.min.y) * 0.5;

  // *** IMPORTANT: rotate model so its nose points +Z ***
  // Most GLB car models are authored facing +Z or -Z. If yours faces a
  // different axis, change this rotation. Try Math.PI if it faces backward.
  model.rotation.y = 0;

  model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });

  car.clear();
  car.add(model);
}, undefined, err => console.warn('Car model failed to load, using fallback.', err));

// --- BUILDING ---
// Fallback buildings: boxes
function spawnFallbackBuildings() {
  for (let ix = 0; ix < GRID; ix++) {
    for (let iz = 0; iz < GRID; iz++) {
      const cx = ix * CELL - HALF + ROAD_W/2 + BLOCK/2;
      const cz = iz * CELL - HALF + ROAD_W/2 + BLOCK/2;
      if (Math.abs(cx) < 20 && Math.abs(cz) < 20) continue;
      const h = 15 + Math.random() * 30;
      const b = new THREE.Mesh(new THREE.BoxGeometry(28, h, 28),
        new THREE.MeshStandardMaterial({ color:0x8899aa, roughness:0.8 }));
      b.position.set(cx, h/2, cz);
      b.castShadow = true; b.receiveShadow = true;
      scene.add(b);
      colliders.push({ minX: cx-14, maxX: cx+14, minZ: cz-14, maxZ: cz+14 });
    }
  }
}

loader.load('models/building.glb', (gltf) => {
  const proto = gltf.scene;
  proto.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });

  // Pre-scale the prototype once, so all clones use the same scale
  const bbox = new THREE.Box3().setFromObject(proto);
  const bs = bbox.getSize(new THREE.Vector3());
  const protoScale = 28 / Math.max(bs.x, bs.z);

  for (let ix = 0; ix < GRID; ix++) {
    for (let iz = 0; iz < GRID; iz++) {
      const cx = ix * CELL - HALF + ROAD_W/2 + BLOCK/2;
      const cz = iz * CELL - HALF + ROAD_W/2 + BLOCK/2;
      if (Math.abs(cx) < 20 && Math.abs(cz) < 20) continue;

      const b = proto.clone(true);
      b.scale.setScalar(protoScale);
      b.position.set(cx, 0, cz);
      b.rotation.y = Math.random() * Math.PI * 2;
      scene.add(b);

      colliders.push({ minX: cx-14, maxX: cx+14, minZ: cz-14, maxZ: cz+14 });
    }
  }
}, undefined, err => {
  console.warn('Building model failed to load, using fallback boxes.', err);
  spawnFallbackBuildings();
});

// ============================================================
// PHYSICS STATE
// ============================================================
const state = { x:0, z:0, heading:0, speed:0, steer:0 };
const MAX_SPEED = 42, MAX_REV = -10;
const ACCEL = 15, BRAKE = 28, FRICTION = 3.5;
const STEER_RATE = 4.0, MAX_STEER = 0.6;
const WHEELBASE = 2.5;
const CAR_RADIUS = 1.5;

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyC') cycleCam();
  if (e.code === 'KeyR') { state.x=0; state.z=0; state.heading=0; state.speed=0; state.steer=0; }
});
addEventListener('keyup', e => { keys[e.code] = false; });

function resolveBuildingCollisions() {
  for (const b of colliders) {
    const nx = Math.max(b.minX, Math.min(state.x, b.maxX));
    const nz = Math.max(b.minZ, Math.min(state.z, b.maxZ));
    const dx = state.x - nx, dz = state.z - nz;
    const d2 = dx*dx + dz*dz;
    if (d2 < CAR_RADIUS*CAR_RADIUS) {
      const d = Math.sqrt(d2) || 0.0001;
      state.x += (dx/d) * (CAR_RADIUS - d);
      state.z += (dz/d) * (CAR_RADIUS - d);
      state.speed *= -0.3;
    }
  }
}

// ============================================================
// AI TRAFFIC
// ============================================================
const aiCars = [];
const AI_SPEED = 11, AI_LANE = 3.0;

for (let i = 0; i < 12; i++) {
  const onX = Math.random() < 0.5;
  const roadIdx = Math.floor(Math.random() * (GRID+1));
  const roadPos = roadIdx * CELL - HALF;
  const along = (Math.random()-0.5) * (HALF*2 - 20);
  let x, z, heading;
  if (onX) {
    x = along; z = roadPos; heading = Math.random() < 0.5 ? Math.PI/2 : -Math.PI/2;
    z += heading > 0 ? AI_LANE : -AI_LANE;
  } else {
    x = roadPos; z = along; heading = Math.random() < 0.5 ? 0 : Math.PI;
    x += heading > 0 ? -AI_LANE : AI_LANE;
  }
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,3.8),
    new THREE.MeshStandardMaterial({ color:[0x3366cc,0xddaa22,0x33aa55][i%3], metalness:0.6, roughness:0.4 }));
  body.position.y = 0.6; body.castShadow = true; g.add(body);
  g.position.set(x, 0, z); g.rotation.y = heading;
  scene.add(g);
  aiCars.push({ mesh: g, x, z, heading, speed: AI_SPEED * (0.7 + Math.random()*0.5) });
}

function updateAI(dt) {
  for (const a of aiCars) {
    const nx = a.x + Math.sin(a.heading) * a.speed * dt;
    const nz = a.z + Math.cos(a.heading) * a.speed * dt;
    if (Math.abs(nx) > HALF || Math.abs(nz) > HALF) a.heading += Math.PI;
    else { a.x = nx; a.z = nz; }
    a.mesh.position.set(a.x, 0, a.z);
    a.mesh.rotation.y = a.heading;
  }
}

// ============================================================
// CAMERA
// ============================================================
const CAM_MODES = ['Chase', 'Hood', 'Cockpit'];
let camMode = 0;
const camLabel = document.getElementById('camLabel');
function cycleCam() {
  camMode = (camMode + 1) % CAM_MODES.length;
  camLabel.textContent = 'Camera: ' + CAM_MODES[camMode];
}

const chasePos = new THREE.Vector3(0, 4.2, -9);
const chaseLook = new THREE.Vector3(0, 1.2, 0);

function updateCamera(dt) {
  const h = state.heading;
  const cos = Math.cos(h), sin = Math.sin(h);
  const speedNorm = Math.abs(state.speed) / MAX_SPEED;

  if (camMode === 0) {
    const back = 9 + speedNorm * 3;
    const up = 4.2 + speedNorm * 0.8;
    const desired = new THREE.Vector3(state.x - sin*back, up, state.z - cos*back);
    const k = 1 - Math.pow(0.0008, dt);
    chasePos.lerp(desired, k);
    chaseLook.lerp(new THREE.Vector3(state.x + sin*5, 1.2, state.z + cos*5), k);
    camera.position.copy(chasePos);
    camera.lookAt(chaseLook);
    camera.fov = 68 + speedNorm * 10;
    camera.updateProjectionMatrix();
  } else {
    const off = camMode === 1
      ? new THREE.Vector3(0, 1.28, 1.55)
      : new THREE.Vector3(0.32, 1.12, -0.15);
    const wx = state.x + off.x*cos + off.z*sin;
    const wz = state.z - off.x*sin + off.z*cos;
    camera.position.set(wx, off.y, wz);
    camera.lookAt(new THREE.Vector3(state.x + sin*20, off.y - 0.15, state.z + cos*20));
    camera.fov = (camMode === 1 ? 72 : 78) + speedNorm * 8;
    camera.updateProjectionMatrix();
  }
}

// ============================================================
// AUDIO
// ============================================================
let audioCtx=null, osc1=null, osc2=null, gain=null;
document.getElementById('start').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gain = audioCtx.createGain(); gain.gain.value = 0; gain.connect(audioCtx.destination);
  osc1 = audioCtx.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=38;
  osc1.connect(gain); osc1.start();
  osc2 = audioCtx.createOscillator(); osc2.type='square'; osc2.frequency.value=76;
  const g2 = audioCtx.createGain(); g2.gain.value=0.35; osc2.connect(g2); g2.connect(gain); osc2.start();
  document.getElementById('start').style.display = 'none';
});

function updateAudio() {
  if (!audioCtx) return;
  const abs = Math.abs(state.speed);
  const f = 38 + (abs / MAX_SPEED) * 150;
  osc1.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.05);
  osc2.frequency.setTargetAtTime(f*2, audioCtx.currentTime, 0.05);
  const thr = (keys['KeyW']||keys['ArrowUp']) ? 1 : 0;
  gain.gain.setTargetAtTime(0.025 + thr*0.055 + (abs/MAX_SPEED)*0.045, audioCtx.currentTime, 0.1);
}

// ============================================================
// MAIN LOOP
// ============================================================
const speedEl = document.getElementById('speed');
const clock = new THREE.Clock();

function updateCar(dt) {
  const thr = (keys['KeyW']||keys['ArrowUp']) ? 1 : 0;
  const brk = (keys['KeyS']||keys['ArrowDown']) ? 1 : 0;
  const lft = (keys['KeyA']||keys['ArrowLeft']) ? 1 : 0;
  const rgt = (keys['KeyD']||keys['ArrowRight']) ? 1 : 0;
  const hb  = keys['Space'] ? 1 : 0;

  const steerTarget = (lft - rgt) * MAX_STEER;
  state.steer += (steerTarget - state.steer) * Math.min(1, STEER_RATE*dt);

  if (thr) state.speed += ACCEL*dt;
  else if (brk) {
    if (state.speed > 0.5) state.speed -= BRAKE*dt;
    else state.speed -= ACCEL*0.45*dt;
  } else {
    if (Math.abs(state.speed) > 0.1) {
      const s = Math.sign(state.speed);
      state.speed -= s * FRICTION * dt;
      if (Math.sign(state.speed) !== s) state.speed = 0;
    }
  }
  if (hb) { const s = Math.sign(state.speed); state.speed -= s*32*dt; if (Math.sign(state.speed)!==s) state.speed=0; }
  state.speed = Math.max(MAX_REV, Math.min(MAX_SPEED, state.speed));

  if (Math.abs(state.speed) > 0.05) {
    const turn = (state.speed / WHEELBASE) * Math.tan(state.steer);
    state.heading += turn * (1/(1+Math.abs(state.speed)*0.02)) * dt;
  }

  state.x += Math.sin(state.heading) * state.speed * dt;
  state.z += Math.cos(state.heading) * state.speed * dt;

  resolveBuildingCollisions();

  car.position.set(state.x, 0, state.z);
  car.rotation.y = state.heading;

  speedEl.textContent = Math.round(Math.abs(state.speed) * 3.6);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateCar(dt);
  updateAI(dt);
  updateCamera(dt);
  updateAudio();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
